version: 1
lesson_id: "1.2.5"
course_id: "c2-sqlite-rust"
concept: "crud_round_trip"
description: >
  Lesson 1.2.5 Playground Proof: insert, get, update and delete round-trip on one row, and deleting a missing row reports false rather than an error. Expected stdout "crud: insert, read, update, delete ok", exit 0.

source:
  demo_crate: "c2-sqlite-rust"
  demo_bin: "l125_crud_round_trip"

playground:
  channel: stable
  mode: debug
  edition: "2024"

proof:
  kind: runtime_assert
  expected_exit_status: 0
  expected_stdout_contains:
    - "crud: insert, read, update, delete ok"

invariants:
  - "compiles on stable channel"
  - "runs without panic"
  - "contains no `unsafe` blocks"
  - "uses only Playground-allowlisted crates (std only)"
  - "source ≤ 5KB"
