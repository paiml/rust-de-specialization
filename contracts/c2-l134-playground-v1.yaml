version: 1
lesson_id: "1.3.4"
course_id: "c2-sqlite-rust"
concept: "transaction_rollback_all_or_nothing"
description: >
  Lesson 1.3.4 Playground Proof: a bulk import is all-or-nothing: one invalid row rolls back the whole batch and leaves previously committed rows untouched. Expected stdout "transaction: rolled back, 2 rows committed", exit 0.

source:
  demo_crate: "c2-sqlite-rust"
  demo_bin: "l134_transaction_rollback_all_or_nothing"

playground:
  channel: stable
  mode: debug
  edition: "2024"

proof:
  kind: runtime_assert
  expected_exit_status: 0
  expected_stdout_contains:
    - "transaction: rolled back, 2 rows committed"

invariants:
  - "compiles on stable channel"
  - "runs without panic"
  - "contains no `unsafe` blocks"
  - "uses only Playground-allowlisted crates (std only)"
  - "source ≤ 5KB"
