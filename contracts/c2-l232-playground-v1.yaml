description: >
  Lesson 2.3.2 Playground Proof: dumping rows to INSERT statements and restoring them reproduces every row exactly. Expected stdout "dump: 3 rows round-tripped", exit 0.

source:
  demo_crate: "c2-sqlite-rust"
  demo_bin: "l232_dump_restore_round_trip"

