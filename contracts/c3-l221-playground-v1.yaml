version: 1
lesson_id: "2.2.1"
course_id: "c3-etl-pipelines"
concept: "computed_columns_exact_cents"
description: >
  Lesson 2.2.1 Playground Proof: computed columns round to exact integer cents and grams, so float noise like 0.29*100 = 28.999999999999996 cannot truncate to the wrong value. Expected stdout "computed columns: 150 cents, 120 g", exit 0.

source:
  demo_crate: "c3-etl-pipelines"
  demo_bin: "l221_computed_columns_exact_cents"

playground:
  channel: stable
  mode: debug
  edition: "2024"

proof:
  kind: runtime_assert
  expected_exit_status: 0
  expected_stdout_contains:
    - "computed columns: 150 cents, 120 g"

invariants:
  - "compiles on stable channel"
  - "runs without panic"
  - "contains no `unsafe` blocks"
  - "uses only Playground-allowlisted crates (std only)"
  - "source ≤ 5KB"
